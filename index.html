<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人网站</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #1e293b;
      line-height: 1.8;
    }
    nav {
      padding: 20px 8%;
      background: white;
      font-weight: bold;
    }
    header {
      padding: 90px 20px;
      text-align: center;
      background: linear-gradient(135deg, #dbeafe, #ede9fe);
    }
    header h1 { font-size: 42px; margin: 0 0 12px; }
    header p { color: #475569; }
    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 24px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 24px;
    }
    main {
      max-width: 850px;
      margin: 40px auto;
      padding: 0 20px;
    }
    section {
      background: white;
      padding: 28px;
      margin-bottom: 22px;
      border-radius: 16px;
    }
    footer {
      padding: 25px;
      text-align: center;
      color: #64748b;
    }
  </style>
</head>
<body>
  <nav>我的个人网站</nav>

  <header>
    <h1>你好，欢迎来到我的网站！</h1>
    <p>这是我的个人空间，也是一个新的开始。</p>
    <a class="button" href="#about">认识一下我</a>
  </header>

  <main>
    <section id="about">
      <h2>关于我</h2>
      <p>你好！我正在学习制作网站，希望在这里记录自己的成长和探索。</p>
    </section>

    <section>
      <h2>我的兴趣</h2>
      <p>游戏、科技、学习新技能，以及探索有趣的事物。</p>
    </section>

    <section id="contact">
      <h2>联系我</h2>
      <p>欢迎以后在这里添加你的联系方式和社交主页。</p>
    </section>
  </main>

  <footer>© 2026 我的个人网站</footer>
</body>
</html>
